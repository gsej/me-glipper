# Static server for the built Angular app (see Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles (main-ABC123.js etc.) never change under the same name.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker and the files it checks for updates must always be
    # revalidated, or the app's update banner never sees a new version.
    location ~ ^/(?:index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Anything else that isn't a file is an app route: serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
