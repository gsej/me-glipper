<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>syringe</title>
  <rect width="32" height="32" fill="white"/>
  <g id="syringe" transform="translate(4, 4) scale(0.75)" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-45 16 16)">
      <!-- barrel -->
      <rect x="11" y="11.5" width="12" height="9" rx="1.6"/>
      <!-- finger flange -->
      <line x1="11" y1="8.5" x2="11" y2="23.5"/>
      <!-- plunger rod + thumb rest -->
      <line x1="14" y1="16" x2="3" y2="16"/>
      <line x1="3" y1="12.5" x2="3" y2="19.5"/>
      <!-- plunger seal inside barrel -->
      <line x1="14" y1="11.5" x2="14" y2="20.5"/>
      <!-- graduation marks -->
      <line x1="17.5" y1="11.5" x2="17.5" y2="13.5"/>
      <line x1="20" y1="11.5" x2="20" y2="13.5"/>
      <!-- hub -->
      <line x1="23" y1="16" x2="26" y2="16"/>
      <!-- needle -->
      <line x1="26" y1="16" x2="31.5" y2="16"/>
    </g>
  </g>
</svg>
