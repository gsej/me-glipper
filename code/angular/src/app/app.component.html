<div
  class="fixed inset-0 w-full sm:max-w-screen-sm mx-auto flex flex-col overflow-hidden"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
>
  <app-update-banner></app-update-banner>

  <main class="flex-1 flex flex-col overflow-hidden relative min-h-0">
    <div class="flex w-full h-full transition-transform" #pagesContainer>
      <div class="w-full flex-shrink-0 h-full">
        <app-overview-page></app-overview-page>
      </div>

      <div class="w-full flex-shrink-0 h-full">
        <app-medication-page></app-medication-page>
      </div>

      <div class="w-full flex-shrink-0 h-full">
        <app-history-page></app-history-page>
      </div>

      <div class="w-full flex-shrink-0 h-full">
        <app-vial-page></app-vial-page>
      </div>
    </div>

    <div class="flex justify-center h-12 w-full absolute bottom-0">
      <div class="flex items-center h-full">
        @for (_ of [].constructor(totalPages); track _; let i = $index) {
          <div
            [class]="
              currentPage === i
                ? 'w-2.5 h-2.5 rounded-full bg-blue-500 mx-1 cursor-pointer transition-colors duration-300'
                : 'w-2.5 h-2.5 rounded-full bg-gray-300 mx-1 cursor-pointer transition-colors duration-300'
            "
            (click)="goToPage(i)"
          ></div>
        }
      </div>
      <!-- Version info, at the right of the page-dots bar so it doesn't need its own row. -->
      <div class="absolute right-4 top-0 h-full flex items-center">
        <app-pi
          [uiHash]="gitHash"
          [apiHash]="apiGitHash"
          [swaggerUrl]="swaggerUrl"
        ></app-pi>
      </div>
    </div>
  </main>
</div>
