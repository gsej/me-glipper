@if (appUpdate.state() !== 'none') {
  <div
    class="absolute top-0 inset-x-0 z-50 flex items-center gap-3 bg-blue-500 text-white text-sm px-4 py-2 shadow"
    role="status"
  >
    <span class="flex-1">
      @if (appUpdate.state() === 'ready') {
        A new version is available.
      } @else {
        This version can't be loaded.
      }
    </span>
    <button
      class="bg-white text-blue-600 font-semibold rounded px-3 py-1"
      (click)="appUpdate.reload()"
    >
      Reload
    </button>
    @if (appUpdate.state() === 'ready') {
      <button class="px-1 text-lg leading-none" aria-label="Dismiss" (click)="appUpdate.dismiss()">
        ✕
      </button>
    }
  </div>
}
