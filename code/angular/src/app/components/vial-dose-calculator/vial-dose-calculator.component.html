<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-3">
  <h3 class="text-base font-semibold text-gray-800 mb-3">Dose calculator</h3>

  @if (vial && concentrationMgPerMl !== null) {
    <div class="mb-4">
      <label for="vial-calc-concentration" class="block text-sm font-medium text-gray-700 mb-1"
        >Concentration</label
      >
      <input
        type="text"
        id="vial-calc-concentration"
        readonly
        tabindex="-1"
        [value]="trim(concentrationMgPerMl, 3) + ' mg/ml'"
        class="w-full px-3 py-2 border border-gray-200 rounded-md bg-gray-50 text-gray-700 text-center focus:outline-none"
      />
    </div>

    <div class="mb-4">
      <label for="vial-calc-doseMg" class="block text-sm font-medium text-gray-700 mb-1"
        >Dose (mg)</label
      >
      <input
        type="number"
        id="vial-calc-doseMg"
        [(ngModel)]="doseMg"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-center"
        step="0.25"
        min="0"
        inputmode="decimal"
      />
    </div>

    <div>
      <label for="vial-calc-draw" class="block text-sm font-medium text-gray-700 mb-1">Draw</label>
      <input
        type="text"
        id="vial-calc-draw"
        readonly
        tabindex="-1"
        [value]="
          drawMl === null || drawUnits === null
            ? ''
            : drawMl.toFixed(2) + ' ml (' + trim(drawUnits, 1) + ' units)'
        "
        class="w-full px-3 py-2 border border-gray-200 rounded-md bg-gray-50 text-gray-900 font-semibold text-center focus:outline-none"
      />
    </div>
  } @else {
    <div class="text-sm text-gray-500">Save the vial's contents to use the calculator</div>
  }
</div>
