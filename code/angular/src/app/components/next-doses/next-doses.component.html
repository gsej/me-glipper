@if (error) {
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    <p>{{ error }}</p>
    <button
      class="mt-2 bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded text-sm"
      (click)="onRetry()"
    >
      Try Again
    </button>
  </div>
}

@if (!isLoading && !error) {
  @if (nextDoses.length === 0) {
    <div class="text-center py-4">
      <p class="text-gray-500">No medications currently being taken.</p>
    </div>
  } @else {
    <div class="space-y-3 pb-3">
      @for (nextDose of nextDoses; track nextDose.medicationName) {
        <button
          type="button"
          class="block w-full text-left bg-white rounded-lg shadow-sm border border-gray-200 p-4 cursor-pointer hover:bg-gray-50 active:bg-gray-100"
          (click)="openMedication(nextDose)"
        >
          <!-- Spans, not div/p: a button may only contain inline content. -->
          <span class="flex items-baseline justify-between">
            <span class="font-medium text-gray-900">{{ nextDose.medicationName }}</span>
            <span
              class="text-sm font-semibold"
              [class.text-red-600]="isOverdue(nextDose)"
              [class.text-blue-600]="!isOverdue(nextDose)"
              >{{ relativeText(nextDose) }}</span
            >
          </span>
          <span class="block mt-2 text-gray-900">
            Next due
            <span class="font-semibold">{{ nextDose.nextDueAt | date: "EEE d MMM" }}</span>
          </span>
        </button>
      }
    </div>
  }
}
