<div class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
  <h2 class="text-xl font-bold text-blue-500 mb-4 text-center">Add dose</h2>

  <form [formGroup]="doseForm" (ngSubmit)="onSubmit()">
    <!-- When taken -->
    <div class="mb-4 grid grid-cols-2 gap-3">
      <div>
        <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Taken on</label>
        <input
          type="date"
          id="date"
          formControlName="date"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="time" class="block text-sm font-medium text-gray-700 mb-1">At</label>
        <input
          type="time"
          id="time"
          formControlName="time"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    </div>

    <!-- Medication -->
    <div class="mb-4">
      <label for="medicationName" class="block text-sm font-medium text-gray-700 mb-1"
        >Medication</label
      >
      <select
        id="medicationName"
        formControlName="medicationName"
        class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="" disabled>Select a medication</option>
        @for (medication of medications; track medication) {
          <option [value]="medication">{{ medication }}</option>
        }
      </select>
    </div>

    <!-- Dose amount -->
    <div class="mb-4">
      <label for="doseAmountMg" class="block text-sm font-medium text-gray-700 mb-1"
        >Dose (mg)</label
      >
      <input
        type="number"
        id="doseAmountMg"
        formControlName="doseAmountMg"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-center"
        step="0.25"
        min="0"
        inputmode="decimal"
      />
    </div>

    <!-- Notes (optional) -->
    @if (!showNote) {
      <button
        type="button"
        (click)="toggleNote()"
        class="mb-4 text-sm text-blue-500 hover:text-blue-600 focus:outline-none"
      >
        + Add note
      </button>
    } @else {
      <div class="mb-4">
        <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Note</label>
        <textarea
          id="notes"
          formControlName="notes"
          maxlength="200"
          rows="2"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        ></textarea>
      </div>
    }

    <button
      type="submit"
      [disabled]="!doseForm.valid"
      class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Save dose
    </button>

    @if (status) {
      <div class="mt-4">
        <div class="text-center">
          <div
            [ngClass]="{
              'text-green-500': status === 'Success',
              'text-red-500': status === 'Error',
            }"
          >
            {{ status }}
            @if (errorStatusCode) {
              <span> ({{ errorStatusCode }})</span>
            }
          </div>
          @if (errorStatusCode === '401') {
            <div class="text-sm text-red-500 mt-1">API key must be supplied</div>
          }
        </div>
      </div>
    }
  </form>
</div>
