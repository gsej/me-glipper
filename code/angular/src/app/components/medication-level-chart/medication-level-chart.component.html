@if (error) {
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    <p>{{ error }}</p>
    <button
      class="mt-2 bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded text-sm"
      (click)="onRetry()"
    >
      Try Again
    </button>
  </div>
}

@if (!error && !isLoading) {
  @if (hasData) {
    <div class="flex justify-center flex-wrap gap-2 mb-4">
      @for (option of rangeOptions; track option.label) {
        <button
          [class]="
            rangeDays === option.days
              ? 'px-3 py-1 text-sm rounded bg-blue-500 text-white'
              : 'px-3 py-1 text-sm rounded bg-gray-200 text-gray-700'
          "
          (click)="setRange(option.days)"
        >
          {{ option.label }}
        </button>
      }
    </div>

    <div class="h-40 sm:h-56 mb-4">
      <app-drug-level-chart
        [times]="times"
        [amountsMg]="amountsMg"
        [color]="color"
        [yMax]="yMax"
        [rangeDays]="rangeDays"
        [nowSecs]="nowSecs"
      ></app-drug-level-chart>
    </div>
  } @else {
    <div class="text-center py-4">
      <p class="text-gray-500">No doses recorded.</p>
    </div>
  }
}
