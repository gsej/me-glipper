# M900 (ThinkCentre) me-glipper LXC built by Terraform (m900 workspace).
# ansible_host matches container_ip_cidr in infra/m900-terraform.tfvars.
# Select with: ansible-playbook -i m900-inventory.ini site.yml
#
# meglipper_ts_hostname sets the Tailscale node name (and thus the Funnel URL:
# https://me-glipper-m900.<tailnet>.ts.net). The default (defaults/main.yml) is
# "me-glipper"; this box overrides it to the box-specific name, matching the
# me-tracker-m900 convention and leaving the canonical "me-glipper" name free.

[meglipper]
meglipper-host ansible_host=192.168.1.222 meglipper_ts_hostname=me-glipper-m900

[meglipper:vars]
ansible_user=root
# Deploy private key lives in the repo (gitignored; restore from your password
# manager). inventory_dir resolves to this ansible/ dir regardless of cwd, so
# the key is shared across environments.
ansible_ssh_private_key_file={{ inventory_dir }}/secrets/deploy_key
